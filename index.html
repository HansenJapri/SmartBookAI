<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- iOS mengabaikan alpha dan menempelkan ikon ke latar hitam, jadi
         apple-touch-icon punya berkas sendiri yang sudah berlatar putih. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SmartBook AI — Pembukuan otomatis multi-channel untuk UMKM Indonesia. Tanpa ngetik: foto struk, forward notif WA, upload mutasi bank & marketplace." />
    <title>SmartBook AI — Pembukuan Otomatis untuk UMKM</title>
    <!-- Font tidak lagi diambil dari CDN Google: <link rel="stylesheet"> ke
         domain pihak ketiga memblokir render, dan di jaringan seluler yang
         tersendat itu berarti layar putih. Sekarang ikut bundel lewat
         @fontsource, di-import dari src/index.css. -->
    <script>
      // Terapkan tema sebelum render agar tidak berkedip (FOUC).
      (function () {
        try {
          var t = localStorage.getItem('bp-theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) { /* abaikan */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
