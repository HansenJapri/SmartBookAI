<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SmartBook AI logo</title>
  <desc id="desc">An open book forming an abstract letter S and a bright intelligent spark, followed by the words SmartBook AI.</desc>
  <defs>
    <linearGradient id="book" x1="50" y1="49" x2="256" y2="306" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="spark" x1="194" y1="58" x2="244" y2="113" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- Icon container -->
  <rect x="36" y="36" width="288" height="288" rx="74" fill="#EEF6FF"/>
  <path d="M180 276.5C143.6 246.2 104.1 231 72 231V111.4C110.1 110.5 147.2 125.1 180 153.5V276.5Z" fill="url(#book)"/>
  <path d="M180 276.5C216.4 246.2 255.9 231 288 231V111.4C249.9 110.5 212.8 125.1 180 153.5V276.5Z" fill="#4338CA"/>
  <path d="M180 153.5V276.5" stroke="#CFFAFE" stroke-width="10" stroke-linecap="round"/>

  <!-- A flowing S path gives the book an intelligent, human character. -->
  <path d="M117 148C139.8 124.6 170.8 121.4 194.5 137.1C220.2 154.2 244 145.3 255 126" stroke="white" stroke-width="17" stroke-linecap="round"/>
  <path d="M106 211C127.5 233.9 158.9 239.6 184.4 224.8C208.8 210.7 232.9 215.7 247 233" stroke="white" stroke-width="17" stroke-linecap="round"/>

  <!-- AI spark / circuit nodes -->
  <path d="M221 84V101M211.5 92.5H230.5M214.2 85.2L227.8 99.8M227.8 85.2L214.2 99.8" stroke="url(#spark)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="247" cy="108" r="8" fill="#22D3EE"/>
  <path d="M241 114L221 134" stroke="#22D3EE" stroke-width="6" stroke-linecap="round"/>
  <circle cx="111" cy="173" r="7" fill="#A5F3FC"/>
  <circle cx="250" cy="181" r="7" fill="#A5F3FC"/>

  <!-- Wordmark -->
  <text x="390" y="184" fill="#172554" font-family="Inter, Avenir Next, Segoe UI, Arial, sans-serif" font-size="108" font-weight="750" letter-spacing="-4">SmartBook</text>
  <rect x="948" y="105" width="122" height="86" rx="43" fill="#2563EB"/>
  <text x="980" y="166" fill="white" font-family="Inter, Avenir Next, Segoe UI, Arial, sans-serif" font-size="51" font-weight="750" letter-spacing="-1">AI</text>
  <text x="396" y="240" fill="#475569" font-family="Inter, Avenir Next, Segoe UI, Arial, sans-serif" font-size="28" font-weight="500" letter-spacing="5">BUKU PINTAR UNTUK BISNIS CERDAS</text>
</svg>
