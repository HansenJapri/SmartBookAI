# ============================================================
# Konfigurasi proyek Supabase — mem-PIN setelan yang tak boleh keliru saat deploy.
# Sebelumnya verify_jwt hanya tersimpan di server; sekarang ter-versi di repo
# agar `supabase functions deploy` selalu reproducible.
# ============================================================
project_id = "hexaidoxmeycctpwfbst"

# harga-daerah: dipanggil dari UI oleh pengguna yang SUDAH login.
[functions.harga-daerah]
verify_jwt = true

# makro-harian: dipicu pg_cron/pg_net (cron harian) TANPA login.
# WAJIB false — kalau terbalik jadi true, cron akan kena 401 & pipeline berhenti.
[functions.makro-harian]
verify_jwt = false

# ai-crud: CRUD lewat prompt/suara. Menulis transaksi, stok, dan data karyawan
# atas nama pengguna, jadi identitas pemanggil adalah syarat mutlak — seluruh
# pengikatan workspace (resolve_owner) dan pemeriksaan modul RBAC bersandar
# padanya. Nilai ini memang sama dengan bawaan CLI hari ini; ia dipin di sini
# karena bergantung pada sebuah default untuk properti keamanan berarti satu
# perubahan di hulu bisa membuka fungsi ini tanpa satu baris pun berubah di repo.
[functions.ai-crud]
verify_jwt = true
